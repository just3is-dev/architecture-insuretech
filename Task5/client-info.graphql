"""
Дата в формате ISO-8601 (YYYY-MM-DD).
"""
scalar Date

"""
Клиент сервиса client-info.
Эквивалент GET /clients/{id} из исходного REST-контракта.
"""
type Client {
  id: ID!
  name: String
  age: Int

  """
  Документы клиента.
  Эквивалент GET /clients/{id}/documents — в GraphQL это вложенное
  поле, а не отдельный запрос: потребитель включает его в выборку,
  только если документы действительно нужны в текущем сценарии.
  """
  documents: [Document!]!

  """
  Родственники клиента.
  Эквивалент GET /clients/{id}/relatives — тоже вложенное поле,
  запрашивается по требованию в той же выборке, что и остальные
  данные клиента.
  """
  relatives: [Relative!]!
}

"""
Документ клиента (паспорт, СНИЛС и т.п.).
"""
type Document {
  id: ID!
  type: String
  number: String
  issueDate: Date
  expiryDate: Date
}

"""
Родственник клиента.
"""
type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}

type Query {
  """
  Получить клиента по ID.
  Один запрос покрывает все три операции исходного REST API
  (клиент, документы, родственники) — состав возвращаемых данных
  определяется набором запрошенных полей, а не количеством вызовов.
  """
  client(id: ID!): Client
}
